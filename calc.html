<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>آلة حاسبة علمية متكاملة</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a, #1e293b);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .calculator {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 24px;
            width: 100%;
            max-width: 460px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }

        .display {
            background: rgba(15, 23, 42, 0.8);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            text-align: right;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .previous-operand {
            color: #94a3b8;
            font-size: 0.95rem;
            min-height: 24px;
            word-wrap: break-word;
        }

        .current-operand {
            color: #f8fafc;
            font-size: 2rem;
            font-weight: 600;
            min-height: 48px;
            word-wrap: break-word;
        }

        .buttons-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
        }

        button {
            border: none;
            outline: none;
            background: rgba(88, 28, 135, 0.4);
            color: #e9d5ff;
            font-size: 1.1rem;
            padding: 16px 8px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
        }

        button:hover {
            background: rgba(126, 34, 206, 0.7);
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        .btn-func {
            background: rgba(13, 148, 136, 0.35);
            color: #5eead4;
            font-size: 0.95rem;
        }

        .btn-func:hover {
            background: rgba(13, 148, 136, 0.65);
        }

        .btn-action {
            background: rgba(217, 119, 6, 0.3);
            color: #fbbf24;
        }

        .btn-action:hover {
            background: rgba(217, 119, 6, 0.6);
        }

        .btn-equal {
            background: #16a34a;
            color: white;
            grid-column: span 2;
            font-weight: bold;
        }

        .btn-equal:hover {
            background: #15803d;
        }

        .btn-operator {
            color: #fb923c;
        }
    </style>
</head>
<body>

<div class="calculator">
    <div class="display">
        <div class="previous-operand" id="previousOperand"></div>
        <div class="current-operand" id="currentOperand">0</div>
    </div>
    
    <div class="buttons-grid">
        <!-- الصف الأول -->
        <button class="btn-func" onclick="appendFunc('sin')">sin</button>
        <button class="btn-func" onclick="appendFunc('cos')">cos</button>
        <button class="btn-func" onclick="appendFunc('tan')">tan</button>
        <button class="btn-action" onclick="clearAll()">AC</button>
        <button class="btn-action" onclick="deleteChar()">DEL</button>

        <!-- الصف الثاني -->
        <button class="btn-func" onclick="appendFunc('sqrt')">√</button>
        <button class="btn-func" onclick="appendValue('**')">xⁿ</button>
        <button class="btn-func" onclick="appendFunc('log')">log</button>
        <button class="btn-func" onclick="appendValue('(')">(</button>
        <button class="btn-func" onclick="appendValue(')')">)</button>

        <!-- الصف الثالث -->
        <button class="btn-func" onclick="appendFunc('ln')">ln</button>
        <button onclick="appendValue('7')">7</button>
        <button onclick="appendValue('8')">8</button>
        <button onclick="appendValue('9')">9</button>
        <button class="btn-operator" onclick="appendValue('/')">÷</button>

        <!-- الصف الرابع -->
        <button class="btn-func" onclick="appendFunc('fact')">n!</button>
        <button onclick="appendValue('4')">4</button>
        <button onclick="appendValue('5')">5</button>
        <button onclick="appendValue('6')">6</button>
        <button class="btn-operator" onclick="appendValue('*')">×</button>

        <!-- الصف الخامس -->
        <button class="btn-func" onclick="appendValue('Math.PI')">π</button>
        <button onclick="appendValue('1')">1</button>
        <button onclick="appendValue('2')">2</button>
        <button onclick="appendValue('3')">3</button>
        <button class="btn-operator" onclick="appendValue('-')">-</button>

        <!-- الصف السادس -->
        <button class="btn-func" onclick="appendValue('Math.E')">e</button>
        <button onclick="appendValue('0')">0</button>
        <button onclick="appendValue('.')">.</button>
        <button class="btn-equal" onclick="calculate()">=</button>
        <button class="btn-operator" onclick="appendValue('+')">+</button>
    </div>
</div>

<script>
    let currentInput = '0';
    let expression = '';

    const currentDisplay = document.getElementById('currentOperand');
    const previousDisplay = document.getElementById('previousOperand');

    function updateDisplay() {
        currentDisplay.innerText = currentInput;
        previousDisplay.innerText = expression;
    }

    function appendValue(val) {
        if (currentInput === '0' && val !== '.') {
            currentInput = val;
        } else {
            currentInput += val;
        }
        updateDisplay();
    }

    function appendFunc(funcName) {
        if (currentInput === '0') currentInput = '';
        currentInput += funcName + '(';
        updateDisplay();
    }

    function clearAll() {
        currentInput = '0';
        expression = '';
        updateDisplay();
    }

    function deleteChar() {
        if (currentInput.length === 1 || currentInput === '0') {
            currentInput = '0';
        } else {
            currentInput = currentInput.slice(0, -1);
        }
        updateDisplay();
    }

    function factorial(n) {
        if (n < 0) return NaN;
        if (n === 0 || n === 1) return 1;
        let res = 1;
        for (let i = 2; i <= n; i++) res *= i;
        return res;
    }

    function calculate() {
        try {
            expression = currentInput;
            let parsedExp = currentInput
                .replace(/sin\(/g, 'Math.sin(')
                .replace(/cos\(/g, 'Math.cos(')
                .replace(/tan\(/g, 'Math.tan(')
                .replace(/sqrt\(/g, 'Math.sqrt(')
                .replace(/log\(/g, 'Math.log10(')
                .replace(/ln\(/g, 'Math.log(')
                .replace(/fact\(([0-9]+)\)/g, (match, p1) => factorial(parseInt(p1)));

            let result = eval(parsedExp);

            if (typeof result === 'number' && !isNaN(result)) {
                // التقريب لمعالجة أخطاء الفاصلة العائمة
                currentInput = Number(result.toFixed(8)).toString();
            } else {
                currentInput = 'خطأ';
            }
        } catch (e) {
            currentInput = 'خطأ';
        }
        updateDisplay();
    }

    // دعم إدخال لوحة المفاتيح
    document.addEventListener('keydown', (e) => {
        if ((e.key >= '0' && e.key <= '9') || e.key === '.' || e.key === '(' || e.key === ')') {
            appendValue(e.key);
        } else if (['+', '-', '*', '/'].includes(e.key)) {
            appendValue(e.key);
        } else if (e.key === 'Enter') {
            calculate();
        } else if (e.key === 'Backspace') {
            deleteChar();
        } else if (e.key === 'Escape') {
            clearAll();
        }
    });
</script>

</body>
